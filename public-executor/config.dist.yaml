postgres:
  host: 127.0.0.1
  port: 15432
  name: decoupage-napkins
  user: decoupage-napkins
  password: "12345678"
  debug: true
  max_open_conns: 10
  max_idle_conns: 10
  conn_max_lifetime: 180s

http:
  host: 127.0.0.1
  port: 9888

s3:
  endpoint: 127.0.0.1:9000
  use_ssl: false
  region: us-east-1
  bucket_name: napkins-shop
  access_key: minioadmin
  secret_key: minioadmin

auth:
  # HS256 ключ. В проде положить минимум 64 случайных байта (base64), здесь
  # — заведомо нерабочий placeholder, чтобы любой, кто скопировал dist,
  # явно его поменял.
  jwt_secret: "CHANGE_ME_dev_only_jwt_secret_at_least_32_bytes_long"
  access_token_ttl: 15m
  refresh_token_ttl: 720h    # 30 дней
  password_reset_ttl: 1h
  email_verify_ttl: 168h    # 7 дней
  guest_cart_ttl: 4320h      # 180 дней
  argon2:
    memory: 65536            # 64 MiB
    iterations: 3
    parallelism: 2
    salt_len: 16
    key_len: 32

shutdown_timeout: 10s
