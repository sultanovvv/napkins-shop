services:
  decoupage-shop-pg:
    container_name: decoupage-shop-pg
    image: postgres:16-alpine
    volumes:
      - shop-decoupage-pg-data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    env_file:
      - '.env'
    environment:
      POSTGRES_DB: $DATABASE_NAME
      POSTGRES_USER: $DATABASE_USER
      POSTGRES_PASSWORD: $DATABASE_PASSWORD
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $DATABASE_USER" ]
      interval: 5s
      timeout: 5s
      retries: 5

  decoupage-shop-pg-migrate:
    image: migrate/migrate:v4.17.1
    profiles: [ "tools" ]
    env_file:
      - '.env'
    depends_on:
      decoupage-shop-pg:
        condition: service_healthy
    volumes:
      - ./shared/providers/core-db/migrations:/migrations
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://$DATABASE_USER:$DATABASE_PASSWORD@decoupage-shop-pg:5432/$DATABASE_NAME?sslmode=disable
    command: [ "up" ]

  decoupage-shop-minio:
    container_name: decoupage-shop-minio
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console UI
    env_file:
      - '.env'
    environment:
      MINIO_ROOT_USER: $S3_ACCESS_KEY
      MINIO_ROOT_PASSWORD: $S3_SECRET_KEY
    volumes:
      - shop-decoupage-minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 5

  decoupage-shop-minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    profiles: [ "tools" ]
    depends_on:
      decoupage-shop-minio:
        condition: service_healthy
    env_file:
      - '.env'
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://decoupage-shop-minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb -p "local/$$S3_BUCKET_NAME" || true
        mc anonymous set download "local/$$S3_BUCKET_NAME"
        echo "bucket $$S3_BUCKET_NAME ready, public-read enabled"

volumes:
  shop-decoupage-pg-data:
  shop-decoupage-minio-data: